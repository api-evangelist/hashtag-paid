aid: hashtag-paid
name: Hashtag Paid
description: >-
  Hashtag Paid Inc., which trades as #paid, is a Toronto-headquartered creator marketing platform
  that connects brands and agencies with social media creators. The product is a marketplace and
  campaign workspace: brands brief a campaign, are matched to vetted creators, review and approve
  content, license and amplify that content as paid social advertising across Meta, TikTok, YouTube,
  Snapchat and Pinterest, then measure results and pay creators automatically. #paid is a badged
  TikTok Marketing Partner and consumes the social platforms' advertising APIs on its customers'
  behalf. It runs as an end-user SaaS product with brand and creator web applications; as of this
  profile it publishes no public developer program, API reference, or machine-readable contract.
